<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <div id="confetti"></div>
    <img src="img/cw_logo_horizontal.png" alt="Water Quest Logo" class="center-image">
    <h1>Water Quest</h1>
    <p class="game-instructions">Collect cans to complete the game based on the difficulty chosen!</p>
    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>
    <div id="achievements" class="achievement"></div>
    <div class="game-grid"></div>
  <button id="easy-game">Easy - 10 can goal</button>
  <button id="medium-game">Medium - 20 can goal</button>
  <button id="hard-game">Hard - 30 can goal</button>
  <button id="reset-game">Reset</button>
  </div>
  <script src="script.js"></script>
  <footer style="text-align:center; margin-top:2em; background:#f7f7f7; padding:1em 0;">
    <p>Support <a href="https://www.charitywater.org" target="_blank" rel="noopener">charity: water</a>!<br>
    <a href="https://www.charitywater.org/donate" target="_blank" rel="noopener">Donate here</a></p>
  </footer>
</body>
</html>
